<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ef">
  <meta name="robots" content="noindex, nofollow">
  <title>登录 · 四足工作台</title>
  <link rel="stylesheet" href="./login.css">
  <script type="module" src="./login.js"></script>
</head>
<body>
  <header class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><strong>四足</strong><span class="divider">/</span><span>ROBOT WORKBENCH</span></header>
  <main>
    <section class="intro" aria-labelledby="introTitle">
      <p class="eyebrow">YOUR ROBOT, YOUR IDEAS</p>
      <h1 id="introTitle">从配色灵感，<br>到每一步动作<span>。</span></h1>
      <p class="intro-copy">登录工作台，继续你的机器狗设计。</p>
      <div class="capabilities"><span>配色设计</span><span>3D 装配</span><span>动作编排</span></div>
      <div class="model-sketch" aria-hidden="true"><svg viewBox="0 0 360 240"><path class="body" d="m80 52 142-12 65 43-143 17-64-48Z"/><path class="side" d="m80 52 64 48v57l-64-47V52Zm64 48 143-17v57l-143 17v-57Z"/><path class="leg" d="m113 129-19 44 31 44m67-65-12 40 33 23m48-94 35 33-15 45M83 104l-25 30 15 44"/><path class="accent" d="m147 109 133-16m-116-36 51-5"/><circle cx="114" cy="129" r="7"/><circle cx="192" cy="152" r="7"/><circle cx="261" cy="121" r="7"/></svg></div>
      <p class="intro-footer">四轴桌面机器狗 <span>DESIGN / BUILD / MOVE</span></p>
    </section>
    <section class="login-card" aria-labelledby="loginTitle">
      <p class="eyebrow"><span class="status-dot"></span> WORKSPACE ACCESS</p>
      <h2 id="loginTitle">欢迎回来</h2>
      <p class="card-copy">使用工作台账号登录。</p>
      <form id="loginForm" method="post">
        <label for="username">账号</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="128" required>
        <label for="password">密码</label>
        <div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required><button type="button" id="showPassword" aria-controls="password" aria-pressed="false">显示</button></div>
        <p id="loginStatus" class="form-status" role="status" aria-live="polite">正在连接工作台…</p>
        <button id="submitLogin" class="submit" type="submit" disabled><span>登录工作台</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
      </form>
      <p class="session-note">登录状态仅用于此工作台，退出后立即失效。</p>
      <noscript><p class="form-status is-error">请启用 JavaScript 后登录。</p></noscript>
    </section>
  </main>
  <footer class="page-footer"><span>四足 · 设计与装配工作台</span><span>MAKE SOMETHING MOVE.</span></footer>
</body>
</html>
